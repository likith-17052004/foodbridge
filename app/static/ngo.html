<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FoodBridge · NGO inbox</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/static/common.js"></script>
</head>
<body class="bg-stone-50 text-slate-800">
  <header class="bg-white border-b sticky top-0 z-10">
    <div class="max-w-3xl mx-auto px-4 h-14 flex items-center gap-4">
      <a href="/" class="font-bold text-lg text-emerald-700">FoodBridge</a>
      <nav class="flex gap-3 text-sm">
        <a href="/" class="text-slate-500 hover:text-slate-900">Donate</a>
        <a href="/ngo" class="font-semibold text-slate-900">NGO inbox</a>
        <a href="/control" class="text-slate-500 hover:text-slate-900">Control room</a>
        <a href="/forecast" class="text-slate-500 hover:text-slate-900">Forecast</a>
        <a href="/dashboard" class="text-slate-500 hover:text-slate-900">Impact</a>
      </nav>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-6 space-y-4">
    <div class="bg-white rounded-xl border p-4">
      <label class="text-xs font-semibold uppercase tracking-wide text-slate-500">Signed in as</label>
      <select id="ngo" class="mt-1 w-full border rounded-lg px-3 py-2"></select>
      <p id="ngoInfo" class="text-xs text-slate-500 mt-2"></p>
      <label class="mt-2 flex items-center gap-2 text-xs text-slate-500"><input type="checkbox" id="followTop" checked />
        Follow the NGO with the newest offer (demo)</label>
    </div>
    <div id="offers" class="space-y-3"></div>
  </main>

<script>
const $ = (id) => document.getElementById(id);
let ngos = [], data = null;

async function init() {
  ngos = await api("/api/ngos");
  $("ngo").innerHTML = ngos.map((n) => `<option value="${n.ngo_id}">${esc(n.name)} (${n.category})</option>`).join("");
  const q = new URLSearchParams(location.search).get("ngo");
  if (q) { $("ngo").value = q; $("followTop").checked = false; }
  $("ngo").onchange = () => { $("followTop").checked = false; load(); };
  load(); setInterval(load, 2000); setInterval(tickCountdowns, 1000);
}

async function load() {
  if ($("followTop").checked) {
    // demo convenience: jump to whichever NGO currently holds a pending offer
    const recent = await api("/api/donations?limit=1");
    const pending = recent[0]?.offers.find((o) => o.status === "pending");
    if (pending && $("ngo").value !== pending.ngo_id) $("ngo").value = pending.ngo_id;
  }
  data = await api(`/api/ngos/${$("ngo").value}/offers`);
  const n = data.ngo;
  $("ngoInfo").textContent = `${n.ward_name || "—"} ward · ~${n.sim_capacity_meals} meals/day · today's gap ~${n.sim_daily_meal_gap} · ${n.sim_accepts_nonveg ? "accepts non-veg" : "veg only"} · need ${n.need_score}/100`;
  render();
}

function render() {
  if (!data.offers.length) { $("offers").innerHTML = `<div class="text-center text-slate-500 py-12">No offers yet. They appear here the moment a nearby restaurant donates.</div>`; return; }
  $("offers").innerHTML = data.offers.map((o) => {
    const d = o.donation, m = o.match || {};
    const live = o.status === "pending";
    const mine = o.status === "accepted";
    return `<div class="bg-white rounded-xl border ${live ? "border-amber-400 ring-2 ring-amber-200" : ""} p-4">
      <div class="flex gap-3">
        <img src="${esc(d.photo_path)}" class="w-24 h-24 rounded-lg object-cover bg-slate-100" alt="" />
        <div class="flex-1 min-w-0">
          <div class="flex items-start justify-between gap-2">
            <div class="font-semibold">${esc(o.dish)} ${dietBadge(d.diet)}</div>${statusPill(mine ? d.status : o.status)}
          </div>
          <div class="text-sm text-slate-600">${d.servings} servings from <b>${esc(o.donor.name)}</b>, ${esc(o.donor.locality)}</div>
          <div class="text-xs text-slate-500 mt-1">${m.km ?? "?"} km · ~${m.travel_min ?? "?"} min each way · safe until <b>${fmtTime(d.safe_until)}</b> · pick up within ${m.margin_min ?? "?"} min margin</div>
          ${live ? `<div class="text-xs mt-1 text-amber-700">Offer expires in <span class="font-mono font-semibold" data-exp="${o.expires_at}">${countdown(o.expires_at)}</span> — then it goes to the next NGO</div>` : ""}
        </div>
      </div>
      ${live ? `<div class="grid grid-cols-2 gap-2 mt-3">
        <button onclick="act('/api/offers/${o.id}/decline')" class="border rounded-lg py-2">Decline</button>
        <button onclick="act('/api/offers/${o.id}/accept')" class="bg-emerald-600 text-white font-semibold rounded-lg py-2">Accept & pick up</button></div>` : ""}
      ${mine && d.status === "accepted" ? `<button onclick="act('/api/donations/${d.id}/picked_up')" class="mt-3 w-full bg-sky-600 text-white rounded-lg py-2">Mark picked up</button>` : ""}
      ${mine && d.status === "picked_up" ? `<button onclick="act('/api/donations/${d.id}/delivered')" class="mt-3 w-full bg-emerald-700 text-white rounded-lg py-2">Mark delivered & served</button>` : ""}
    </div>`;
  }).join("");
}

function tickCountdowns() { document.querySelectorAll("[data-exp]").forEach((el) => (el.textContent = countdown(el.dataset.exp))); }
async function act(path) {
  try { await postJSON(path); } catch (e) { alert(e.message); }
  $("followTop").checked = false; load();
}
init();
</script>
</body>
</html>
